[project]
name = "jevdash"
version = "0.1.0"
description = "Backend for live data-monitoring dashboards: Jev decides, code computes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    # jeveval (../../eval) supplies the shared taxonomy, prompts and Jev constants;
    # install it first with `pip install -e ../../eval`.
    "jeveval",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jevdash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
